name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build | tee build.log
        env:
          # Build must succeed without secrets — inert placeholders kick in.
          # Real values are injected by Vercel per-environment at deploy time.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # Contrainte non négociable §2.1 du brief : aucune route au-dessus du
      # budget. Bloquant — une régression de poids se paie en secondes d'attente
      # sur un lien Edge.
      - name: Budget bundle (Bandal Test)
        run: node scripts/check-bundle-budget.mjs build.log
